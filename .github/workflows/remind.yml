# Once a day, ask the uf-notify edge function to send "Tomorrow: …" to
# everyone who's in on a plan that starts in 10–38 hours. 13:10 UTC is
# 9:10am Eastern (8:10am when the clocks are on standard time — fine).
#
# SUPABASE_ANON_KEY is the publishable key from js/net.js. It is NOT a
# secret (every visitor's browser has it); it lives in a repo secret only so
# this file stays key-free. Settings → Secrets and variables → Actions →
# New repository secret → SUPABASE_ANON_KEY. workflow_dispatch is on for a
# manual run (Actions → remind → Run workflow) when you want to test.
name: remind

on:
  schedule:
    - cron: '10 13 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Poke uf-notify (kind remind)
        run: |
          curl -s -X POST https://jnouvwxomrcffqwilqkq.supabase.co/functions/v1/uf-notify \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d '{"kind":"remind"}'
          echo
